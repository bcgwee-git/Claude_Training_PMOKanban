name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html exists
        run: test -f index.html
      - name: Check project constraints
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|!important|alert\(|confirm\(' index.html; then
            echo "::error::Forbidden API or CSS found in index.html"
            exit 1
          fi
      - name: Check FORMSUBMIT_ENDPOINT is still the placeholder
        run: |
          grep -qE 'FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com"' index.html \
            || { echo "::error::FORMSUBMIT_ENDPOINT is not the placeholder"; exit 1; }

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage site (index.html only)
        run: |
          mkdir _site
          cp index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
